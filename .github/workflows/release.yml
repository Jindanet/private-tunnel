name: Build and publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: private-tunnel-releases
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: plan
        name: Skip published versions and validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs plan

  source:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libcups2t64 libxss1 libxkbcommon0 fonts-noto-core
      - run: npm ci
      - run: xvfb-run --auto-servernum npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:linux
      - name: Prepare source and Linux CLI
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PTUNNEL_CONFIG_PATH: ${{ runner.temp }}/ptunnel-release-smoke.json
        run: |
          mkdir -p release-artifacts
          git archive --format=zip --prefix="PrivateTunnel-$RELEASE_VERSION/" --output="release-artifacts/PrivateTunnel-v$RELEASE_VERSION-source.zip" HEAD
          cp dist/ptunnel-linux "release-artifacts/ptunnel-v$RELEASE_VERSION-linux-x64"
          dist/ptunnel-linux --help
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrivateTunnel-source-linux
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm.cmd run build:app:win -- --publish=never
      - run: npm.cmd run build:win
      - name: Archive unsigned desktop build and Windows CLI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PTUNNEL_CONFIG_PATH: ${{ runner.temp }}/ptunnel-release-smoke.json
        run: |
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Compress-Archive -Path 'dist-app/win-unpacked/*' -DestinationPath "release-artifacts/PrivateTunnel-v$env:RELEASE_VERSION-windows-x64-unsigned.zip"
          Copy-Item -LiteralPath dist/ptunnel-win.exe -Destination "release-artifacts/ptunnel-v$env:RELEASE_VERSION-windows-x64.exe"
          & dist/ptunnel-win.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows CLI smoke test failed.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrivateTunnel-windows-x64-unsigned
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  macos-cli:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            script: build:macos
            binary: ptunnel-macos
            arch: x64
          - os: macos-15
            script: build:macos-arm
            binary: ptunnel-macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
      - name: Prepare and smoke-test native macOS CLI
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          CLI_BINARY: ${{ matrix.binary }}
          CLI_ARCH: ${{ matrix.arch }}
          PTUNNEL_CONFIG_PATH: ${{ runner.temp }}/ptunnel-release-smoke.json
        run: |
          mkdir -p release-artifacts
          "dist/$CLI_BINARY" --help
          cp "dist/$CLI_BINARY" "release-artifacts/ptunnel-v$RELEASE_VERSION-macos-$CLI_ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrivateTunnel-macos-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, source, windows-desktop, macos-cli]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: PrivateTunnel-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish complete release and mark it Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs publish
