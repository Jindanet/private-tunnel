# Linux host networking keeps Nginx -> PrivateTunnel on trusted loopback.
# Do not use bridge networking without implementing an explicit trusted-proxy policy.
# TCP_ALLOWED_PORTS defaults to 30000-40000 inclusive; preopen it in host/cloud
# firewalls and any NAT. It declares policy, not verified external reachability.
# Additional fallback ports must be opened first, then declared in .env.
# Priority: 30000-40000, 40001-65535, 1024-29999; skip occupied/disallowed ports.
# Exhausted eligible ports fail; no privileged ports or ephemeral/port-0 fallback.
# Host networking requires no Docker port mappings. Test public access externally.
services:
  private-tunnel:
    build: .
    image: private-tunnel:1.2.2
    network_mode: host
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_HOST: 127.0.0.1
      DATA_DIR: /var/lib/private-tunnel
      SQLITE_PATH: /var/lib/private-tunnel/tunnel.db
      AUTO_FIREWALL: "false"
    volumes:
      - tunnel-data:/var/lib/private-tunnel
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  tunnel-data:
